worker_processes 1;
pid "/mnt/c/Users/gonza/OneDrive/Desktop/Sistemas Distribuidos/clase_22/nginx/nginx-wsl.pid";
error_log /tmp/clase22-nginx-error.log;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    access_log off;

    server {
        listen 8090;
        server_name localhost;

        location / {
            root "/mnt/c/Users/gonza/OneDrive/Desktop/Sistemas Distribuidos/clase_22/web";
            index index.html;
        }

        location = /dispatcher {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
